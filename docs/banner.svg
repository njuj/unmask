<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace"><defs><style>.n{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.flow{stroke-dasharray:6 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.glow{animation:gl 2.6s ease-in-out infinite}@keyframes gl{50%{opacity:.35}}</style><radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ff0055" stop-opacity=".22"/><stop offset=".6" stop-color="#ff0055" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="1280" height="440" rx="18" fill="#0b0f17"/><rect width="1280" height="440" rx="18" fill="url(#grid)"/><rect width="1280" height="440" rx="18" fill="url(#g)"/><rect x="48" y="44" width="6" height="58" rx="3" fill="#ff0055"/><text x="72" y="70" font-size="13" letter-spacing="4" fill="#6e7681">NJUJ / TOOL</text><text x="72" y="104" font-size="40" font-weight="800" fill="#f0f3f6">unmask</text><text x="72" y="140" font-size="17" fill="#ff0055">Follow a malware delivery chain to the RAT at its end, and find out who</text><text x="72" y="164" font-size="17" fill="#ff0055">controls it.</text><g class="n" style="animation-delay:0.25s"><rect x="72" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#1f2a3a" stroke-width="1.2"/><text x="320" y="226" text-anchor="end" font-size="12" fill="#3d4757">01</text><g transform="translate(92 216) scale(1.6)" fill="none" stroke="#ff0055" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></g><text x="92" y="294" font-size="17" font-weight="700" fill="#f0f3f6">Fake cheat</text><text x="92" y="322" font-size="13" fill="#8b949e">ZIP, installer or script</text><text x="92" y="342" font-size="13" fill="#8b949e">that carries a loader</text></g><path class="flow" d="M342 280.0 H370" stroke="#ff0055" stroke-width="2" fill="none" opacity=".8"/><path d="M364 275.0 l6 5 -6 5" stroke="#ff0055" stroke-width="2" fill="none"/><g class="n" style="animation-delay:0.60s"><rect x="376" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#1f2a3a" stroke-width="1.2"/><text x="624" y="226" text-anchor="end" font-size="12" fill="#3d4757">02</text><g transform="translate(396 216) scale(1.6)" fill="none" stroke="#ff0055" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17.5l9 5 9-5"/></g><text x="396" y="294" font-size="17" font-weight="700" fill="#f0f3f6">Peel every stage</text><text x="396" y="322" font-size="13" fill="#8b949e">resources, overlays, XOR,</text><text x="396" y="342" font-size="13" fill="#8b949e">base64, gzip, AES keys</text></g><path class="flow" d="M646 280.0 H674" stroke="#ff0055" stroke-width="2" fill="none" opacity=".8"/><path d="M668 275.0 l6 5 -6 5" stroke="#ff0055" stroke-width="2" fill="none"/><g class="n" style="animation-delay:0.95s"><rect x="680" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#1f2a3a" stroke-width="1.2"/><text x="928" y="226" text-anchor="end" font-size="12" fill="#3d4757">03</text><g transform="translate(700 216) scale(1.6)" fill="none" stroke="#ff0055" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="7" width="8" height="13" rx="4"/><path d="M12 7V3M8 11H3M8 16H3M16 11h5M16 16h5M5 6l3 3M19 6l-3 3"/></g><text x="700" y="294" font-size="17" font-weight="700" fill="#f0f3f6">Reach the RAT</text><text x="700" y="322" font-size="13" fill="#8b949e">njRAT or XWorm,</text><text x="700" y="342" font-size="13" fill="#8b949e">named by its code</text></g><path class="flow" d="M950 280.0 H978" stroke="#ff0055" stroke-width="2" fill="none" opacity=".8"/><path d="M972 275.0 l6 5 -6 5" stroke="#ff0055" stroke-width="2" fill="none"/><g class="n" style="animation-delay:1.30s"><rect class="glow" x="984" y="196" width="266" height="168" rx="14" fill="#ff0055" opacity=".18" filter="url(#sh)"/><rect x="984" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#ff0055" stroke-width="2"/><text x="1232" y="226" text-anchor="end" font-size="12" fill="#3d4757">04</text><g transform="translate(1004 216) scale(1.6)" fill="none" stroke="#ff0055" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></g><text x="1004" y="294" font-size="17" font-weight="700" fill="#f0f3f6">Config + takedown</text><text x="1004" y="322" font-size="13" fill="#8b949e">C2, mutex, Telegram bot,</text><text x="1004" y="342" font-size="13" fill="#8b949e">where to report them</text></g><g class="n" style="animation-delay:1.8s"><rect x="72" y="378" width="182" height="28" rx="14" fill="none" stroke="#ff0055" stroke-opacity=".5"/><text x="163" y="397" text-anchor="middle" font-size="12.5" fill="#ff0055">never runs the sample</text></g><g class="n" style="animation-delay:1.8s"><rect x="263.6" y="378" width="166" height="28" rx="14" fill="none" stroke="#ff0055" stroke-opacity=".5"/><text x="347" y="397" text-anchor="middle" font-size="12.5" fill="#ff0055">never contacts a C2</text></g><g class="n" style="animation-delay:1.8s"><rect x="440.0" y="378" width="83" height="28" rx="14" fill="none" stroke="#ff0055" stroke-opacity=".5"/><text x="481" y="397" text-anchor="middle" font-size="12.5" fill="#ff0055">30 tests</text></g><rect x=".5" y=".5" width="1279" height="439" rx="18" fill="none" stroke="#1b2533"/></svg>