[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unmask-rat"
dynamic = ["version"]
description = "Unwrap a malware delivery chain stage by stage without running it, and extract the RAT configuration at its end: njRAT and XWorm C2 hosts, ports, keys, mutex, Telegram bot, plus where to report them. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "kira", email = "286490266+njuj@users.noreply.github.com" }]
keywords = ["malware-analysis", "config-extractor", "njrat", "xworm", "rat", "c2", "reverse-engineering", "dfir", "threat-intel", "blue-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/njuj/unmask"

[project.scripts]
unmask = "unmask.cli:main"

[tool.setuptools.dynamic]
version = { attr = "unmask.__version__" }

[tool.setuptools.packages.find]
include = ["unmask*"]

